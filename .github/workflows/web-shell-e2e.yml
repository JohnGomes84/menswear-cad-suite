name: Browser E2E — Synthetic CAD Lab

on:
  push:
    paths:
      - "prototype/web-app/e2e/**"
      - "prototype/web-app/playwright.config.ts"
      - ".github/workflows/web-shell-e2e.yml"
  pull_request:
    paths:
      - "prototype/web-app/e2e/**"
      - "prototype/web-app/playwright.config.ts"
      - ".github/workflows/web-shell-e2e.yml"
      - "prototype/web-app/package*.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: prototype/web-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install existing dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium and runtime libraries
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E tests
        run: npx playwright test
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-e2e-evidence
          path: prototype/web-app/test-results/
          if-no-files-found: ignore
          retention-days: 7
