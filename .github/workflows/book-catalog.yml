name: Book method discovery catalog

on:
  push:
    paths:
      - "docs/product/**"
      - ".github/workflows/book-catalog.yml"
  pull_request:
    paths:
      - "docs/product/**"
      - ".github/workflows/book-catalog.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check discovery data
        run: python docs/product/validate_catalog.py
      - name: Test catalog invariants
        run: python -m unittest discover -s docs/product -p 'test_*.py' -v
